<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank connection authorized</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #e8eaed;
  }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.35rem; margin: 0 0 .75rem; font-weight: 600; }
  p { margin: 0; color: #a8b0bd; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .9em;
    background: #1b1f27;
    padding: .15rem .4rem;
    border-radius: 4px;
  }
</style>
</head>
<body>
<main>
  <h1 id="status">Connection authorized</h1>
  <p id="detail">You can close this tab and return to the terminal.</p>
</main>

<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script>
(function () {
  // This page is a static OAuth landing page. In the common desktop popup
  // flow Plaid returns control to the original window and this page is never
  // reached. When it is reached, Link must be reinitialized with the same
  // link_token that started the session.
  var params = new URLSearchParams(window.location.search);
  var oauthStateId = params.get('oauth_state_id');
  var statusEl = document.getElementById('status');
  var detailEl = document.getElementById('detail');

  if (!oauthStateId) {
    return;
  }

  var linkToken = null;
  try {
    linkToken = localStorage.getItem('link_token');
  } catch (e) {
    linkToken = null;
  }

  if (!linkToken || typeof Plaid === 'undefined') {
    detailEl.textContent =
      'Authorization received. Return to the terminal — the Plaid fetch step will finish the connection.';
    return;
  }

  try {
    localStorage.removeItem('link_token');
  } catch (e) {}

  var handler = Plaid.create({
    token: linkToken,
    receivedRedirectUri: window.location.href,
    onSuccess: function () {
      statusEl.textContent = 'Connected';
      detailEl.textContent =
        'Account linked successfully. You can close this tab and return to the terminal.';
    },
    onExit: function () {
      statusEl.textContent = 'Not finished';
      detailEl.textContent =
        'Link closed before the connection completed. Return to the terminal and run the setup again.';
    }
  });

  handler.open();
})();
</script>
</body>
</html>
